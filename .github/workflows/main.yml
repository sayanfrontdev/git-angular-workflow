name: Build my angular website

on:
  push:
    branches: [ main ]

jobs:
  build-angular-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.1.0
      - name: Setup node js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
      - name: Install Dependencies
        run: npm install
      - name: Build Angular app
        run: npm run build
